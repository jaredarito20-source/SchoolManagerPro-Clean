{% extends "base.html" %}

{% block content %}

<h2>Edit Inventory Item</h2>

<form method="post">

{% csrf_token %}

<p>
<label>Category</label><br>

<select name="category">

{% for category in categories %}

<option value="{{ category.id }}"
{% if item.category.id == category.id %}selected{% endif %}>

{{ category.name }}

</option>

{% endfor %}

</select>

</p>

<p>

<label>Item Name</label><br>

<input
type="text"
name="name"
value="{{ item.name }}"
required>

</p>

<p>

<label>Quantity</label><br>

<input
type="number"
name="quantity"
value="{{ item.quantity }}"
required>

</p>

<p>

<label>Unit</label><br>

<input
type="text"
name="unit"
value="{{ item.unit }}">

</p>

<p>

<label>Minimum Stock</label><br>

<input
type="number"
name="minimum_stock"
value="{{ item.minimum_stock }}">

</p>

<p>

<label>Store Location</label><br>

<input
type="text"
name="location"
value="{{ item.location }}">

</p>

<p>

<label>Description</label><br>

<textarea
name="description"
rows="4">{{ item.description }}</textarea>

</p>

<button type="submit">

Update Item

</button>

</form>

{% endblock %}

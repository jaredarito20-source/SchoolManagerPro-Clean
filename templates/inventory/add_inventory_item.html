{% extends "base.html" %}

{% block content %}

<h2>➕ Add Inventory Item</h2>

<form method="post">

    {% csrf_token %}

    <p>

        <label>Category</label><br>

        <select name="category" required>

            <option value="">Select Category</option>

            {% for category in categories %}

            <option value="{{ category.id }}">
                {{ category.name }}
            </option>

            {% endfor %}

        </select>

    </p>

    <p>

        <label>Item Name</label><br>

        <input
            type="text"
            name="name"
            required
        >

    </p>

    <p>

        <label>Quantity</label><br>

        <input
            type="number"
            name="quantity"
            value="0"
            required
        >

    </p>

    <p>

        <label>Unit</label><br>

        <input
            type="text"
            name="unit"
            value="Pieces"
        >

    </p>

    <p>

        <label>Minimum Stock</label><br>

        <input
            type="number"
            name="minimum_stock"
            value="5"
        >

    </p>

    <p>

        <label>Store Location</label><br>

        <input
            type="text"
            name="location"
        >

    </p>

    <p>

        <label>Description</label><br>

        <textarea
            name="description"
            rows="4"
        ></textarea>

    </p>

    <button type="submit">
        Save Inventory Item
    </button>

</form>

{% endblock %}

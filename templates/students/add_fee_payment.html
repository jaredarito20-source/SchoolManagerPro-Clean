{% extends "base.html" %}

{% block content %}

<h2>💰 Receive Fee Payment</h2>

<form method="POST">


{% csrf_token %}

<!-- ================================= -->
<!-- SCHOOL -->
<!-- ================================= -->

{% if request.user.is_superuser %}

<p>
    <label>School</label><br>

    <select name="school" id="school" required>

        <option value="">Select School</option>

        {% for school in schools %}

        <option
            value="{{ school.id }}"
            data-academic-year="{{ school.academic_year }}"
            data-current-term="{{ school.current_term }}"
            {% if selected_school and school.id == selected_school.id %}
                selected
            {% endif %}
        >
            {{ school.name }}
        </option>

        {% endfor %}

    </select>
</p>

{% endif %}


<!-- ================================= -->
<!-- ACADEMIC YEAR -->
<!-- ================================= -->

<p>

    <label>Academic Year</label><br>

    <select
        name="academic_year"
        id="academic_year"
        required
    >

        <option value="">
            Select Academic Year
        </option>

        {% for year in academic_years %}

        <option
            value="{{ year }}"
            {% if year|stringformat:"s" == academic_year|stringformat:"s" %}
                selected
            {% endif %}
        >
            {{ year }}
        </option>

        {% endfor %}

    </select>

</p>


<!-- ================================= -->
<!-- TERM -->
<!-- ================================= -->

<p>

    <label>Term</label><br>

    <select
        name="enrollment_term"
        id="enrollment_term"
        required
    >

        <option value="">
            Select Term
        </option>

        <option
            value="1"
            {% if current_term == "1" %}
                selected
            {% endif %}
        >
            Term 1
        </option>

        <option
            value="2"
            {% if current_term == "2" %}
                selected
            {% endif %}
        >
            Term 2
        </option>

        <option
            value="3"
            {% if current_term == "3" %}
                selected
            {% endif %}
        >
            Term 3
        </option>

    </select>

</p>


<!-- ================================= -->
<!-- CLASS -->
<!-- ================================= -->

<p>

    <label>Class</label><br>

    <select
        name="school_class"
        id="school_class"
        required
    >

        <option value="">
            Select Class
        </option>

        {% for school_class in classes %}

        <option
            value="{{ school_class.id }}"
            {% if selected_class and school_class.id == selected_class.id %}
                selected
            {% endif %}
        >
            {{ school_class.name }}
        </option>

        {% endfor %}

    </select>

</p>


<!-- ================================= -->
<!-- STUDENT -->
<!-- ================================= -->

<p>

    <label>Student</label><br>

    <select
        name="student"
        id="student"
        required
    >

        <option value="">
            Select Student
        </option>

        {% for student in students %}

        <option
            value="{{ student.id }}"
            data-class-id="{% if student.school_class %}{{ student.school_class.id }}{% endif %}"
        >

            {{ student.first_name }}
            {{ student.last_name }}

            {% if student.school_class %}
                — {{ student.school_class.name }}
            {% endif %}

        </option>

        {% endfor %}

    </select>

</p>


<!-- ================================= -->
<!-- PAYMENT -->
<!-- ================================= -->

<p>

    <label>Amount</label><br>

    <input
        type="number"
        name="amount"
        min="0.01"
        step="0.01"
        required
    >

</p>


<p>

    <label>Payment Date</label><br>

    <input
        type="date"
        name="payment_date"
        value="{{ today|date:'Y-m-d' }}"
        required
    >

</p>


<!-- ================================= -->
<!-- PAYMENT METHOD -->
<!-- ================================= -->

<p>

    <label>Payment Method</label><br>

    <select
        name="payment_method"
        required
    >

        <option value="">
            Select Payment Method
        </option>

        <option value="Cash">
            Cash
        </option>

        <option value="M-Pesa">
            M-Pesa
        </option>

        <option value="Bank">
            Bank
        </option>

        <option value="Cheque">
            Cheque
        </option>

    </select>

</p>


<!-- ================================= -->
<!-- REFERENCE -->
<!-- ================================= -->

<p>

    <label>Reference</label><br>

    <input
        type="text"
        name="reference"
        placeholder="M-Pesa code / bank reference"
    >

</p>


<!-- ================================= -->
<!-- REMARKS -->
<!-- ================================= -->

<p>

    <label>Remarks</label><br>

    <textarea
        name="remarks"
        rows="3"
    ></textarea>

</p>


<button type="submit">
    Receive Payment
</button>
```

</form>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const schoolSelect =
        document.getElementById("school");

    const academicYearSelect =
        document.getElementById("academic_year");

    const termSelect =
        document.getElementById("enrollment_term");

    const classSelect =
        document.getElementById("school_class");

    const studentSelect =
        document.getElementById("student");


    // =================================
    // SCHOOL PERIOD
    // =================================

    function updateSchoolPeriod() {

        if (!schoolSelect) {
            return;
        }

        const selected =
            schoolSelect.options[
                schoolSelect.selectedIndex
            ];

        if (!selected) {
            return;
        }

        const academicYear =
            selected.dataset.academicYear || "";

        const currentTerm =
            selected.dataset.currentTerm || "";


        // Select school's academic year

        if (academicYear) {

            const yearOption =
                Array.from(
                    academicYearSelect.options
                ).find(function (option) {

                    return option.value === academicYear;

                });

            if (yearOption) {

                academicYearSelect.value =
                    academicYear;

            }
        }


        // Select school's current term

        if (
            currentTerm === "1" ||
            currentTerm === "2" ||
            currentTerm === "3"
        ) {

            termSelect.value =
                currentTerm;

        }

    }


    // =================================
    // FILTER STUDENTS BY CLASS
    // =================================

    function filterStudentsByClass() {

        if (!classSelect || !studentSelect) {
            return;
        }

        const selectedClass =
            classSelect.value;


        // Reset student selection

        studentSelect.value = "";


        Array.from(
            studentSelect.options
        ).forEach(function (option) {

            // Always keep "Select Student"

            if (!option.value) {

                option.hidden = false;
                return;

            }


            const studentClass =
                option.dataset.classId || "";


            if (
                selectedClass &&
                studentClass === selectedClass
            ) {

                option.hidden = false;

            } else {

                option.hidden = true;

            }

        });

    }


    // =================================
    // SCHOOL CHANGE
    // =================================

    if (schoolSelect) {

        schoolSelect.addEventListener(
            "change",
            function () {

                /*
                 * Reload the page for the selected school.
                 *
                 * This causes the backend to load:
                 * - that school's classes
                 * - that school's students
                 * - that school's academic years
                 */

                const schoolId =
                    schoolSelect.value;

                if (!schoolId) {
                    return;
                }

                window.location.href =
                    "?school=" + encodeURIComponent(
                        schoolId
                    );

            }
        );

        updateSchoolPeriod();

    }


    // =================================
    // CLASS CHANGE
    // =================================

    if (classSelect) {

        classSelect.addEventListener(
            "change",
            filterStudentsByClass
        );

    }


    // =================================
    // INITIAL STUDENT FILTER
    // =================================

    filterStudentsByClass();

});

</script>

{% endblock %}

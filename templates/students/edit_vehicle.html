
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Edit Vehicle</h2>

        <a href="{% url 'students:vehicle_list' %}"
           class="btn btn-secondary">
            ← Back to Vehicles
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Vehicle Details</strong>
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {% if request.user.is_superuser and vehicle.school %}
                    <div class="mb-3">
                        <label class="form-label">
                            School
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ vehicle.school.name }}"
                            readonly
                        >

                        <div class="form-text">
                            The school cannot be changed when editing a vehicle.
                        </div>
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="registration_number"
                           class="form-label">
                        Registration Number
                    </label>

                    <input
                        type="text"
                        name="registration_number"
                        id="registration_number"
                        class="form-control"
                        value="{{ vehicle.registration_number }}"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="vehicle_name"
                           class="form-label">
                        Vehicle Name
                    </label>

                    <input
                        type="text"
                        name="vehicle_name"
                        id="vehicle_name"
                        class="form-control"
                        value="{{ vehicle.vehicle_name }}"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="make"
                           class="form-label">
                        Make / Model
                    </label>

                    <input
                        type="text"
                        name="make"
                        id="make"
                        class="form-control"
                        value="{{ vehicle.make }}"
                        maxlength="100"
                    >
                </div>

                <div class="mb-3">
                    <label for="capacity"
                           class="form-label">
                        Capacity
                    </label>

                    <input
                        type="number"
                        name="capacity"
                        id="capacity"
                        class="form-control"
                        value="{{ vehicle.capacity }}"
                        min="1"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="driver"
                           class="form-label">
                        Assigned Driver
                    </label>

                    <select
                        name="driver"
                        id="driver"
                        class="form-select"
                    >
                        <option value="">
                            -- No Driver Assigned --
                        </option>

                        {% for driver in drivers %}
                            <option
                                value="{{ driver.id }}"
                                {% if vehicle.driver_id == driver.id %}
                                    selected
                                {% endif %}
                            >
                                {{ driver.first_name }} {{ driver.last_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="status"
                           class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        id="status"
                        class="form-select"
                        required
                    >
                        <option
                            value="Active"
                            {% if vehicle.status == "Active" %}
                                selected
                            {% endif %}
                        >
                            Active
                        </option>

                        <option
                            value="Maintenance"
                            {% if vehicle.status == "Maintenance" %}
                                selected
                            {% endif %}
                        >
                            Maintenance
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{% url 'students:vehicle_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}

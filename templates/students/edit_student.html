<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h1>Edit Student</h1>

<form method="post">
    {% csrf_token %}

    <p>Admission Number</p>
    <input type="text" name="admission_number" value="{{ student.admission_number }}" required>

    <p>First Name</p>
    <input type="text" name="first_name" value="{{ student.first_name }}" required>

    <p>Last Name</p>
    <input type="text" name="last_name" value="{{ student.last_name }}" required>

    <p>Gender</p>
    <select name="gender">
        <option value="Male" {% if student.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if student.gender == "Female" %}selected{% endif %}>Female</option>
    </select>

    <p>Date of Birth</p>
    <input type="date" name="date_of_birth" value="{{ student.date_of_birth|date:'Y-m-d' }}">

    <p>Class</p>
    <input type="text" name="class_name" value="{{ student.class_name }}">

    <p>Parent Name</p>
    <input type="text" name="parent_name" value="{{ student.parent_name }}">

    <p>Phone</p>
    <input type="text" name="phone" value="{{ student.phone }}">

    <br><br>

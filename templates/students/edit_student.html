{% extends "base.html" %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <table>

        <tr>
            <td>Admission Number</td>
            <td>
                <input
                    type="text"
                    name="admission_number"
                    value="{{ student.admission_number }}"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>First Name</td>
            <td>
                <input
                    type="text"
                    name="first_name"
                    value="{{ student.first_name }}"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Last Name</td>
            <td>
                <input
                    type="text"
                    name="last_name"
                    value="{{ student.last_name }}"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <select name="gender" required>

                    <option value="Male"
                        {% if student.gender == "Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if student.gender == "Female" %}selected{% endif %}>
                        Female
                    </option>

                </select>
            </td>
        </tr>

        <tr>
            <td>Date of Birth</td>
            <td>
                <input
                    type="date"
                    name="date_of_birth"
                    value="{{ student.date_of_birth|date:'Y-m-d' }}"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Class</td>
            <td>

                <select name="school_class" required>

                    {% for class in classes %}

                    <option value="{{ class.id }}"
                        {% if student.school_class.id == class.id %}selected{% endif %}>
                        {{ class.name }}
                    </option>

                    {% endfor %}

                </select>

            </td>
        </tr>

        <tr>
            <td>Parent Name</td>
            <td>
                <input
                    type="text"
                    name="parent_name"
                    value="{{ student.parent_name }}"
                    required
                >
            </td>
        </tr>
        <tr>
            <td>Parent Account</td>
            <td>

                <select name="parent_user">

                    <option value="">---------</option>

                    {% for parent in parents %}

                    <option value="{{ parent.id }}"
                        {% if student.parent_user == parent %}selected{% endif %}>

                        {{ parent.get_full_name|default:parent.username }}

                    </option>

                    {% endfor %}

                </select>

            </td>
        </tr>

        <tr>
            <td>Phone Number</td>
            <td>
                <input
                    type="text"
                    name="phone"
                    value="{{ student.phone }}"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Current Photo</td>
            <td>

                {% if student.photo %}
                    <img src="{{ student.photo.url }}"
                         width="120"
                         height="140"
                         style="border:1px solid #999;">
                {% else %}
                    No photo uploaded.
                {% endif %}

            </td>
        </tr>

        <tr>
            <td>Change Photo</td>
            <td>
                <input
                    type="file"
                    name="photo"
                    accept="image/*"
                >
            </td>
        </tr>

        <tr>
            <td></td>
            <td>

                <button type="submit">
                    💾 Update Student
                </button>

                <a href="{% url 'student_list' %}">
                    Cancel
                </a>

            </td>
        </tr>

    </table>

</form>

{% endblock %}

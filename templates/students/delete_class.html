{% extends "base.html" %}

{% block content %}

<h2>Delete Class</h2>

<p>
    Are you sure you want to delete
    <strong>{{ school_class.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'class_list' %}">
        <button type="button">Cancel</button>
    </a>
</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Edit Transport Route</h2>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Route Name</label><br>
        <input
            type="text"
            name="route_name"
            value="{{ route.route_name }}"
            required
        >
    </p>

    <p>
        <label>Start Point</label><br>
        <input
            type="text"
            name="start_point"
            value="{{ route.start_point }}"
            required
        >
    </p>

    <p>
        <label>End Point</label><br>
        <input
            type="text"
            name="end_point"
            value="{{ route.end_point }}"
            required
        >
    </p>

    <p>
        <label>Distance (KM)</label><br>
        <input
            type="number"
            step="0.01"
            name="distance_km"
            value="{{ route.distance_km }}"
        >
    </p>

    <p>
        <label>Vehicle</label><br>

        <select name="vehicle">

            <option value="">Select Vehicle</option>

            {% for vehicle in vehicles %}

                <option
                    value="{{ vehicle.id }}"
                    {% if route.vehicle and route.vehicle.id == vehicle.id %}selected{% endif %}
                >
                    {{ vehicle.registration_number }}
                    -
                    {{ vehicle.vehicle_name }}
                </option>

            {% endfor %}

        </select>

    </p>

    <p>
        <label>Driver</label><br>

        <select name="driver">

            <option value="">Select Driver</option>

            {% for teacher in teachers %}

                <option
                    value="{{ teacher.id }}"
                    {% if route.driver and route.driver.id == teacher.id %}selected{% endif %}
                >
                    {{ teacher.first_name }}
                    {{ teacher.last_name }}
                </option>

            {% endfor %}

        </select>

    </p>

    <p>

        <label>

            <input
                type="checkbox"
                name="active"
                {% if route.active %}checked{% endif %}
            >

            Active Route

        </label>

    </p>

    <button type="submit">
        Update
    </button>

    <a href="{% url 'transport_route_list' %}">
        <button type="button">
            Cancel
        </button>
    </a>

</form>

{% endblock %}

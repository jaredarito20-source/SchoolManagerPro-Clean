{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>➕ Add Class</h2>

    <form method="POST">
        {% csrf_token %}

        {% if user.is_superuser %}

            <div class="form-group">
                <label for="school">School</label>

                <select name="school" id="school" required>
                <option value="">Select school</option>

                {% for school in schools %}
                    <option
                        value="{{ school.id }}"
                        data-curriculum="{{ school.curriculum_system }}"
                    >
                        {{ school.name }}
                    </option>
                {% endfor %}
            </select>
            </div>

        {% else %}

            <div class="form-group">
                <label>School</label>

                <div class="readonly-field">
                    {{ user.school_user.school.name }}
                </div>

                <input
                    type="hidden"
                    id="school_curriculum"
                    value="{{ user.school_user.school.curriculum_system }}"
                >
            </div>

        {% endif %}


        <div class="form-group">
            <label for="name">Class Name</label>

            <input
                type="text"
                name="name"
                id="name"
                placeholder="e.g. Grade 1"
                required
            >
        </div>
        <div class="form-group">
            <label>Curriculum</label>

            <div class="readonly-field">
                {{ user.school_user.school.curriculum_system }}
            </div>
        </div>
        <div class="form-group">
            <label for="class_teacher">Class Teacher</label>

            <select name="class_teacher" id="class_teacher">

                <option value="">
                    Select class teacher
                </option>

                {% for teacher in teachers %}
                    <option value="{{ teacher.id }}">
                        {{ teacher.first_name }} {{ teacher.last_name }}
                    </option>
                {% endfor %}

            </select>
        </div>


        <div class="form-actions">

            <button type="submit" class="btn btn-primary">
                💾 Save Class
            </button>

            <a href="{% url 'students:class_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const schoolSelect = document.getElementById("school");
    const curriculumSelect = document.getElementById("curriculum");
    const schoolCurriculum = document.getElementById("school_curriculum");

    function updateCurriculumOptions() {

        curriculumSelect.innerHTML = "";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select curriculum";
        curriculumSelect.appendChild(placeholder);

        let curriculumSystem = "";

        // Superuser
        if (schoolSelect) {

            const selectedOption =
                schoolSelect.options[schoolSelect.selectedIndex];

            if (selectedOption) {
                curriculumSystem =
                    selectedOption.dataset.curriculum || "";
            }

        // Normal school user
        } else if (schoolCurriculum) {

            curriculumSystem =
                schoolCurriculum.value || "";
        }

        if (curriculumSystem === "CBC") {

            const option = document.createElement("option");
            option.value = "CBC";
            option.textContent = "CBC";
            option.selected = true;

            curriculumSelect.appendChild(option);

        } else if (curriculumSystem === "8-4-4") {

            const option = document.createElement("option");
            option.value = "8-4-4";
            option.textContent = "8-4-4";
            option.selected = true;

            curriculumSelect.appendChild(option);

        } else if (curriculumSystem === "BOTH") {

            const cbcOption = document.createElement("option");
            cbcOption.value = "CBC";
            cbcOption.textContent = "CBC";

            const oldOption = document.createElement("option");
            oldOption.value = "8-4-4";
            oldOption.textContent = "8-4-4";

            curriculumSelect.appendChild(cbcOption);
            curriculumSelect.appendChild(oldOption);
        }
    }

    if (schoolSelect) {
        schoolSelect.addEventListener(
            "change",
            updateCurriculumOptions
        );
    }

    updateCurriculumOptions();
});
</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Delete Marks</h2>

<p>
    Are you sure you want to delete this mark?
</p>

<ul>
    <li><strong>Student:</strong> {{ mark.student }}</li>
    <li><strong>Subject:</strong> {{ mark.subject }}</li>
    <li><strong>Exam:</strong> {{ mark.exam }}</li>
    <li><strong>Marks:</strong> {{ mark.marks }}</li>
</ul>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'mark_list' %}">
        <button type="button">Cancel</button>
    </a>

</form>

{% endblock %}

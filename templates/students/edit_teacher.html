{% extends "base.html" %}

{% block content %}

<h2>Edit Teacher</h2>

<form method="POST">
    {% csrf_token %}

    <p>
        <label>First Name</label><br>
        <input type="text" name="first_name" value="{{ teacher.first_name }}" required>
    </p>

    <p>
        <label>Last Name</label><br>
        <input type="text" name="last_name" value="{{ teacher.last_name }}" required>
    </p>

    <p>
        <label>Gender</label><br>
        <select name="gender">
            <option value="Male" {% if teacher.gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if teacher.gender == "Female" %}selected{% endif %}>Female</option>
        </select>
    </p>

    <p>
        <label>Phone</label><br>
        <input type="text" name="phone" value="{{ teacher.phone }}" required>
    </p>

    <p>
        <label>Email</label><br>
        <input type="email" name="email" value="{{ teacher.email }}" required>
    </p>

    <p>
        <label>Subject</label><br>
        <input type="text" name="subject" value="{{ teacher.subject }}" required>
    </p>

    <button type="submit">Update Teacher</button>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h1>Delete Exam</h1>

<p>
    Are you sure you want to delete
    <strong>{{ exam.name }}</strong>?
</p>

<p>
    <strong>Term:</strong> {{ exam.term }}
</p>

<p>
    <strong>Year:</strong> {{ exam.year }}
</p>

{% if exam.school %}
<p>
    <strong>School:</strong> {{ exam.school.name }}
</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <button type="submit">
        🗑 Yes, Delete
    </button>

    <a href="{% url 'students:exam_list' %}">
        Cancel
    </a>
</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Take Class Attendance</h2>

<form method="get">
    <label>Select Class</label>

    <select name="class">
        <option value="">-- Choose Class --</option>

        {% for class in classes %}
            <option value="{{ class.id }}"
                {% if selected_class and selected_class.id == class.id %}
                    selected
                {% endif %}
            >
                {{ class.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Load Students</button>
</form>

<hr>

{% if students %}

<form method="post">
    {% csrf_token %}

    <input
        type="hidden"
        name="school_class"
        value="{{ selected_class.id }}"
    >

    <table border="1" cellpadding="8">
        <tr>
            <th>Admission No</th>
            <th>Student</th>
            <th>Status</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.admission_number }}</td>
            <td>{{ student.first_name }} {{ student.last_name }}</td>

            <td>
                <select name="status_{{ student.id }}">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                    <option value="Excused">Excused</option>
                </select>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <label>Date</label>

    <input
    type="date"
    name="date"
    value="{{ today|date:'Y-m-d' }}"
    required
>

    <br><br>

    <button type="submit">
        Save Attendance
    </button>

</form>

{% endif %}

{% endblock %}

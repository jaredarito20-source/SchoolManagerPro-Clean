{% extends "base.html" %}

{% block content %}

<h2>Delete User</h2>

<p>
Are you sure you want to delete
<strong>{{ user_obj.username }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        🗑 Yes, Delete
    </button>

    <a href="{% url 'user_list' %}">
        Cancel
    </a>

</form>

{% endblock %}

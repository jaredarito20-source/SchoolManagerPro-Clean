{% extends "base.html" %}

{% block content %}

<h2>Edit Fee Payment</h2>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Student</label><br>
        <select name="student" required>

            {% for student in students %}
                <option value="{{ student.id }}"
                    {% if student.id == payment.student.id %}
                        selected
                    {% endif %}
                >
                    {{ student.admission_number }} -
                    {{ student.first_name }} {{ student.last_name }}
                </option>
            {% endfor %}

        </select>
    </p>

    <p>
        <label>Amount Paid</label><br>
        <input
            type="number"
            step="0.01"
            name="amount_paid"
            value="{{ payment.amount_paid }}"
            required
        >
    </p>

    <p>
        <label>Payment Date</label><br>
        <input
            type="date"
            name="payment_date"
            value="{{ payment.payment_date|date:'Y-m-d' }}"
            required
        >
    </p>

    <p>
        <label>Payment Method</label><br>
        <input
            type="text"
            name="payment_method"
            value="{{ payment.payment_method }}"
            required
        >
    </p>

    <p>
        <label>Receipt Number</label><br>
        <input
            type="text"
            name="receipt_number"
            value="{{ payment.receipt_number }}"
        >
    </p>

    <button type="submit">
        Update Payment
    </button>

    <a href="{% url 'fee_payment_list' %}">
        <button type="button">
            Cancel
        </button>
    </a>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Delete Student Transport</h2>

<p>

Are you sure you want to remove

<strong>

{{ transport.student.first_name }}
{{ transport.student.last_name }}

</strong>

from transport?

</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'student_transport_list' %}">
        <button type="button">
            Cancel
        </button>
    </a>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div style="max-width:500px; margin:40px auto;">

    <h2>🔐 Reset User Password</h2>

    <p>
        Reset password for:
        <strong>
            {{ user_account.username }}
        </strong>
    </p>

    {% if messages %}
        {% for message in messages %}
            <div style="margin-bottom:15px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <p>
            <label>
                <strong>New Password</strong>
            </label><br>

            <input
                type="password"
                name="password"
                required
                minlength="8"
                style="width:100%; padding:8px;"
            >
        </p>

        <p>
            <label>
                <strong>Confirm Password</strong>
            </label><br>

            <input
                type="password"
                name="confirm_password"
                required
                minlength="8"
                style="width:100%; padding:8px;"
            >
        </p>

        <button type="submit">
            🔐 Reset Password
        </button>

        <a href="{% url 'user_list' %}">
            <button type="button">
                Cancel
            </button>
        </a>

    </form>

</div>

{% endblock %}

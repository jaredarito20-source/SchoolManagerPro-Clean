{% extends "base.html" %}

{% block content %}

<h2>Delete Timetable</h2>

<p>
Are you sure you want to delete this timetable entry?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'students:timetable_list' %}">
        Cancel
    </a>
</form>

{% endblock %}

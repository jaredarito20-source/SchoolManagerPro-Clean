{% extends "base.html" %}

{% block content %}

<h2>Delete Attendance</h2>

<p>
    Are you sure you want to delete this attendance record?
</p>

<ul>
    <li><strong>Student:</strong> {{ attendance.student }}</li>
    <li><strong>Date:</strong> {{ attendance.date }}</li>
    <li><strong>Status:</strong> {{ attendance.status }}</li>
</ul>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        🗑 Yes, Delete
    </button>

    <a href="{% url 'attendance_list' %}">
        Cancel
    </a>
</form>

{% endblock %}

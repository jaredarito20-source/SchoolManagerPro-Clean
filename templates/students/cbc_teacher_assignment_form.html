
{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>➕ Add CBC Teacher Assignment</h2>

    <p>
        Assign a teacher to a CBC learning area for a specific class and academic year.
    </p>

    <hr>

    <form method="post">

        {% csrf_token %}


        {% if request.user.is_superuser %}

            <!-- =========================================
                 SCHOOL
            ========================================== -->

            <label for="school">
                School
            </label>

            <select
                name="school"
                id="school"
            >

                <option value="">
                    All Schools
                </option>

                {% for item in schools %}

                    <option
                        value="{{ item.id }}"
                        {% if school and school.id == item.id %}
                            selected
                        {% endif %}
                    >

                        {{ item.school_name }}

                    </option>

                {% endfor %}

            </select>

            <br><br>

        {% endif %}


        <!-- =========================================
             ACADEMIC YEAR
             Source: SchoolAcademicYear
        ========================================== -->

        <label for="academic_year">
            Academic Year
        </label>

        <select
            name="academic_year"
            id="academic_year"
            required
        >

            <option value="">
                -- Select Academic Year --
            </option>

            {% for academic_year in academic_years %}

                <option
                    value="{{ academic_year.year }}"
                    {% if selected_year == academic_year.year|stringformat:"s" %}
                        selected
                    {% endif %}
                >

                    {{ academic_year.year }}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <!-- =========================================
             CBC CLASS
        ========================================== -->

        <label for="school_class_curriculum">
            CBC Class
        </label>

        <select
            name="school_class_curriculum"
            id="school_class_curriculum"
            required
        >

            <option value="">
                -- Select CBC Class --
            </option>

            {% for item in class_curricula %}

                <option
                    value="{{ item.id }}"
                    data-grade="{{ item.curriculum_grade.grade }}"
                    data-pathway="{% if item.pathway %}{{ item.pathway.id }}{% endif %}"
                    data-year="{{ item.academic_year }}"
                    data-school="{{ item.school_class.school.id }}"
                >

                    {{ item.school_class.name }}
                    —
                    {{ item.curriculum_grade.display_name }}

                    {% if item.pathway %}
                        —
                        {{ item.pathway.get_name_display }}
                    {% endif %}

                    —
                    {{ item.academic_year }}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <!-- =========================================
             TEACHER
        ========================================== -->

        <label for="teacher">
            Teacher
        </label>

        <select
            name="teacher"
            id="teacher"
            required
        >

            <option value="">
                -- Select Teacher --
            </option>

            {% for teacher in teachers %}

                <option
                    value="{{ teacher.id }}"
                    data-school="{{ teacher.school.id }}"
                >

                    {{ teacher.user.get_full_name|default:teacher.user.username }}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <!-- =========================================
             LEARNING AREA
        ========================================== -->

        <label for="learning_area">
            Learning Area
        </label>

        <select
            name="learning_area"
            id="learning_area"
            required
        >

            <option value="">
                -- Select Learning Area --
            </option>

            {% for area in learning_areas %}

                <option
                    value="{{ area.id }}"
                    data-grade="{{ area.curriculum_grade.grade }}"
                    data-pathway="{% if area.pathway %}{{ area.pathway.id }}{% endif %}"
                >

                    {{ area.name }}

                    —
                    {{ area.curriculum_grade.display_name }}

                    {% if area.pathway %}
                        —
                        {{ area.pathway.get_name_display }}
                    {% endif %}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <!-- =========================================
             ACTIONS
        ========================================== -->

        <button type="submit">
            💾 Save Assignment
        </button>

        <a href="{% url 'students:cbc_teacher_assignment_list' %}">
            Cancel
        </a>

    </form>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const schoolSelect =
        document.getElementById("school");

    const academicYearSelect =
        document.getElementById("academic_year");

    const classSelect =
        document.getElementById("school_class_curriculum");

    const teacherSelect =
        document.getElementById("teacher");

    const learningAreaSelect =
        document.getElementById("learning_area");


    /* ================================================
       SCHOOL CHANGE
       Reload the page so the server can load the
       correct SchoolAcademicYear records.
    ================================================= */

    if (schoolSelect) {

        schoolSelect.addEventListener(
            "change",
            function () {

                const schoolId =
                    this.value;

                const url =
                    new URL(
                        window.location.href
                    );

                if (schoolId) {

                    url.searchParams.set(
                        "school",
                        schoolId
                    );

                } else {

                    url.searchParams.delete(
                        "school"
                    );

                }

                /*
                 * Changing school means the old academic
                 * year may no longer be valid.
                 */
                url.searchParams.delete(
                    "academic_year"
                );

                window.location.href =
                    url.toString();

            }
        );

    }


    /* ================================================
       ACADEMIC YEAR CHANGE
       Reload the page so the server filters CBC
       class curricula using SchoolAcademicYear.
    ================================================= */

    academicYearSelect.addEventListener(
        "change",
        function () {

            const year =
                this.value;

            const url =
                new URL(
                    window.location.href
                );

            if (year) {

                url.searchParams.set(
                    "academic_year",
                    year
                );

            } else {

                url.searchParams.delete(
                    "academic_year"
                );

            }

            window.location.href =
                url.toString();

        }
    );


    /* ================================================
       FILTER TEACHERS
       Teachers must belong to the same school as
       the selected CBC class.
    ================================================= */

    function filterTeachers() {

        if (!classSelect.value) {

            teacherSelect.value = "";

            Array.from(
                teacherSelect.options
            ).forEach(function (option) {

                option.hidden = false;

            });

            return;
        }

        const selectedClass =
            classSelect.options[
                classSelect.selectedIndex
            ];

        const schoolId =
            selectedClass.dataset.school;


        Array.from(
            teacherSelect.options
        ).forEach(function (option) {

            if (!option.value) {

                option.hidden = false;

                return;
            }

            option.hidden =
                option.dataset.school !== schoolId;

        });


        teacherSelect.value = "";

    }


    /* ================================================
       FILTER LEARNING AREAS
       Learning areas must match the selected class
       grade and pathway.
    ================================================= */

    function filterLearningAreas() {

        if (!classSelect.value) {

            learningAreaSelect.value = "";

            Array.from(
                learningAreaSelect.options
            ).forEach(function (option) {

                option.hidden = false;

            });

            return;
        }

        const selectedClass =
            classSelect.options[
                classSelect.selectedIndex
            ];

        const grade =
            selectedClass.dataset.grade;

        const pathway =
            selectedClass.dataset.pathway;


        Array.from(
            learningAreaSelect.options
        ).forEach(function (option) {

            if (!option.value) {

                option.hidden = false;

                return;
            }

            const sameGrade =
                option.dataset.grade === grade;

            const samePathway =
                option.dataset.pathway === pathway;


            option.hidden =
                !(sameGrade && samePathway);

        });


        learningAreaSelect.value = "";

    }


    /* ================================================
       CLASS CHANGE
    ================================================= */

    classSelect.addEventListener(
        "change",
        function () {

            filterTeachers();

            filterLearningAreas();

        }
    );


    /* ================================================
       INITIAL FILTER
       Useful when the page loads with a selected
       academic year and available classes.
    ================================================= */

    if (classSelect.value) {

        filterTeachers();

        filterLearningAreas();

    }

});

</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>Add Hostel Room</h2>

<form method="POST">

{% csrf_token %}

<p>

<label>Hostel Block</label><br>

<select name="block" required>

<option value="">Select Block</option>

{% for block in blocks %}

<option value="{{ block.id }}">

{{ block.name }}

</option>

{% endfor %}

</select>

</p>

<p>

<label>Room Number</label><br>

<input
type="text"
name="room_number"
required>

</p>

<p>

<label>Capacity</label><br>

<input
type="number"
name="capacity"
min="1"
required>

</p>

<button type="submit">

Save

</button>

<a href="{% url 'students:hostel_room_list' %}">
<button type="button">

Cancel

</button>
</a>

</form>

{% endblock %}

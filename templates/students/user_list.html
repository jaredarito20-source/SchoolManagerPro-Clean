{% extends "base.html" %}

{% block content %}

<h2>User Management</h2>

<a href="{% url 'add_user' %}" class="btn btn-primary">
    ➕ Add User
</a>

<br><br>

<table border="1" cellpadding="8">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Staff</th>
        <th>Superuser</th>
        <th>Active</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.is_staff }}</td>
        <td>{{ user.is_superuser }}</td>
        <td>{{ user.is_active }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}

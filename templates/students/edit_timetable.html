{% extends "base.html" %}

{% block content %}

<h2>Edit Timetable</h2>

<form method="post">


{% csrf_token %}

<p>
    <label for="school_class">Class</label><br>

    <select name="school_class" id="school_class" required>

        {% for class in classes %}

            <option value="{{ class.id }}"
                {% if timetable.school_class.id == class.id %}
                    selected
                {% endif %}
            >
                {{ class.name }}
            </option>

        {% endfor %}

    </select>
</p>


<p>
    <label for="subject">Subject</label><br>

    <select name="subject" id="subject" required>

        {% for subject in subjects %}

            <option value="{{ subject.id }}"
                {% if timetable.subject.id == subject.id %}
                    selected
                {% endif %}
            >
                {{ subject.name }}
            </option>

        {% endfor %}

    </select>
</p>


<p>
    <label for="teacher">Teacher</label><br>

    <select name="teacher" id="teacher" required>

        {% for teacher in teachers %}

            <option value="{{ teacher.id }}"
                {% if timetable.teacher.id == teacher.id %}
                    selected
                {% endif %}
            >
                {{ teacher.first_name }} {{ teacher.last_name }}
            </option>

        {% endfor %}

    </select>
</p>


<p>
    <label for="day">Day</label><br>

    <select name="day" id="day" required>

        <option value="">-- Select Day --</option>

        {% for day in days %}

            <option value="{{ day.id }}"
                {% if timetable.day.id == day.id %}
                    selected
                {% endif %}
            >
                {{ day.name }}
            </option>

        {% endfor %}

    </select>
</p>


<p>
    <label for="period">Period</label><br>

    <select name="period" id="period" required>

        <option value="">-- Select Period --</option>

        {% for period in periods %}

            <option value="{{ period.id }}"
                {% if timetable.period.id == period.id %}
                    selected
                {% endif %}
            >
                {{ period.name }}
                ({{ period.start_time|time:"H:i" }} -
                {{ period.end_time|time:"H:i" }})

                {% if period.is_break %}
                    - Break
                {% endif %}
            </option>

        {% endfor %}

    </select>
</p>


{% if timetable.locked %}

    <p>
        <strong>This timetable entry is locked.</strong>
        It cannot be edited.
    </p>

{% else %}

    <button type="submit">
        Update Timetable
    </button>

{% endif %}


<a href="{% url 'students:timetable_list' %}">
    Cancel
</a>


</form>

{% endblock %}

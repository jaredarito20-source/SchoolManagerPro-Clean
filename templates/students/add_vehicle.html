{% extends "base.html" %}

{% block content %}

<h2>🚗 Add Vehicle</h2>

<form method="POST">

    {% csrf_token %}

    {% if request.user.is_superuser %}
        <p>
            <label><strong>School</strong></label><br>

            <select name="school" required>
                <option value="">-- Select School --</option>

                {% for school in schools %}
                    <option value="{{ school.id }}">
                        {{ school.name }}
                    </option>
                {% endfor %}
            </select>
        </p>
    {% endif %}

    <p>
        <label><strong>Registration Number</strong></label><br>
        <input
            type="text"
            name="registration_number"
            maxlength="30"
            required
        >
    </p>

    <p>
        <label><strong>Vehicle Name</strong></label><br>
        <input
            type="text"
            name="vehicle_name"
            maxlength="100"
            required
        >
    </p>

    <p>
        <label><strong>Make / Model</strong></label><br>
        <input
            type="text"
            name="make"
            maxlength="100"
        >
    </p>

    <p>
        <label><strong>Capacity</strong></label><br>
        <input
            type="number"
            name="capacity"
            min="1"
            required
        >
    </p>

    <p>
        <label><strong>Driver</strong></label><br>

        <select name="driver">
            <option value="">-- No Driver --</option>

            {% for driver in drivers %}
                <option value="{{ driver.id }}">
                    {{ driver.first_name }}
                    {{ driver.last_name }}
                </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label><strong>Status</strong></label><br>

        <select name="status" required>
            <option value="Active">
                Active
            </option>

            <option value="Maintenance">
                Maintenance
            </option>
        </select>
    </p>

    <button type="submit">
        💾 Save Vehicle
    </button>

    <a href="{% url 'vehicle_list' %}">
        <button type="button">
            Cancel
        </button>
    </a>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h2>💉 New Prescription</h2>

<form method="post">

    {% csrf_token %}

    <table cellpadding="8">

        <tr>

            <td><strong>Class</strong></td>

            <td>

                <select
                    name="school_class"
                    onchange="this.form.submit()"
                    required
                >

                    <option value="">-- Select Class --</option>

                    {% for class in classes %}

                    <option
                        value="{{ class.id }}"
                        {% if selected_class == class.id|stringformat:"s" %}
                        selected
                        {% endif %}
                    >

                        {{ class.name }}

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Medical Visit</strong></td>

            <td>

                <select
                    name="medical_visit"
                    required
                >

                    <option value="">-- Select Medical Visit --</option>

                    {% for visit in visits %}

                    <option value="{{ visit.id }}">

                        {{ visit.student.admission_number }}
                        -
                        {{ visit.student.first_name }}
                        {{ visit.student.last_name }}
                        -
                        {{ visit.visit_date }}

                    </option>

                    {% empty %}

                    <option disabled>

                        Select a class first

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Medication</strong></td>

            <td>

                <select
                    name="medication"
                    required
                >

                    <option value="">-- Select Medication --</option>

                    {% for medication in medications %}

                    <option value="{{ medication.id }}">

                        {{ medication.name }}
                        (Stock:
                        {{ medication.quantity_in_stock }})

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Dosage</strong></td>

            <td>

                <input
                    type="text"
                    name="dosage"
                    placeholder="Example: 2 Tablets"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Frequency</strong></td>

            <td>

                <input
                    type="text"
                    name="frequency"
                    placeholder="Example: Twice Daily"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Duration</strong></td>

            <td>

                <input
                    type="text"
                    name="duration"
                    placeholder="Example: 5 Days"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Quantity</strong></td>

            <td>

                <input
                    type="number"
                    name="quantity"
                    min="1"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Instructions</strong></td>

            <td>

                <textarea
                    name="instructions"
                    rows="4"
                    cols="60"
                    placeholder="Example: Take after meals."
                ></textarea>

            </td>

        </tr>

        <tr>

            <td colspan="2">

                <button
                    type="submit"
                    name="save_prescription"
                >

                    💾 Save Prescription

                </button>

                <a href="{% url 'students:prescription_list' %}">

                    <button type="button">

                        Cancel

                    </button>

                </a>

            </td>

        </tr>

    </table>

</form>

{% endblock %}

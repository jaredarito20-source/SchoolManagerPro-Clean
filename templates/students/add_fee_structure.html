{% extends "base.html" %}

{% block content %}

<h2>Add Fee Structure</h2>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Class</label><br>

        <select name="school_class" required>

            <option value="">Select Class</option>

            {% for class in classes %}

                <option value="{{ class.id }}">
                    {{ class.name }}
                </option>

            {% endfor %}

        </select>

    </p>

    <p>
        <label>Tuition Fee</label><br>
        <input type="number" step="0.01" name="tuition_fee" required>
    </p>

    <p>
        <label>Activity Fee</label><br>
        <input type="number" step="0.01" name="activity_fee" value="0">
    </p>

    <p>
        <label>Exam Fee</label><br>
        <input type="number" step="0.01" name="exam_fee" value="0">
    </p>

    <p>
        <label>Other Fee</label><br>
        <input type="number" step="0.01" name="other_fee" value="0">
    </p>

    <button type="submit">
        Save Fee Structure
    </button>

</form>

{% endblock %}

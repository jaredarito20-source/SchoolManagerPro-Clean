{% extends "base.html" %}

{% block content %}

<h2>Add Salary Structure</h2>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Teacher</label><br>
        <select name="teacher" required>
            <option value="">Select Teacher</option>

            {% for teacher in teachers %}
                <option value="{{ teacher.id }}">
                    {{ teacher.first_name }} {{ teacher.last_name }}
                </option>
            {% endfor %}

        </select>
    </p>

    <p>
        <label>Basic Salary</label><br>
        <input type="number" step="0.01" name="basic_salary" required>
    </p>

    <p>
        <label>House Allowance</label><br>
        <input type="number" step="0.01" name="house_allowance" value="0">
    </p>

    <p>
        <label>Transport Allowance</label><br>
        <input type="number" step="0.01" name="transport_allowance" value="0">
    </p>

    <p>
        <label>Medical Allowance</label><br>
        <input type="number" step="0.01" name="medical_allowance" value="0">
    </p>

    <p>
        <label>Other Allowance</label><br>
        <input type="number" step="0.01" name="other_allowance" value="0">
    </p>

    <p>
        <label>NSSF</label><br>
        <input type="number" step="0.01" name="nssf" value="0">
    </p>

    <p>
        <label>SHA</label><br>
        <input type="number" step="0.01" name="sha" value="0">
    </p>

    <p>
        <label>Other Deductions</label><br>
        <input
            type="number"
            step="0.01"
            name="other_deductions"
            value="0"
        >
    </p>
    <p>
    <label>Bank Name</label><br>
    <input type="text" name="bank_name">
</p>

<p>
    <label>Account Number</label><br>
    <input type="text" name="account_number">
</p>

    <p>
        <label>PAYE</label><br>
        <input type="number" step="0.01" name="paye" value="0">
    </p>

    <button type="submit">Save</button>

    <a href="{% url 'salary_structure_list' %}">
        <button type="button">Cancel</button>
    </a>

</form>

{% endblock %}

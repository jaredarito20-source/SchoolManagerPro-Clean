{% extends "base.html" %}

{% block content %}

<h2>🏥 New Medical Visit</h2>

<form method="post">

    {% csrf_token %}

    <table cellpadding="8">

        <tr>

            <td><strong>Class</strong></td>

            <td>

                <select
                    name="school_class"
                    onchange="this.form.submit()"
                    required
                >

                    <option value="">-- Select Class --</option>

                    {% for class in classes %}

                    <option
                        value="{{ class.id }}"
                        {% if selected_class == class.id|stringformat:"s" %}
                        selected
                        {% endif %}
                    >

                        {{ class.name }}

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Student</strong></td>

            <td>

                <select
                    name="student"
                    required
                >

                    <option value="">-- Select Student --</option>

                    {% for student in students %}

                    <option value="{{ student.id }}">

                        {{ student.admission_number }}
                        -
                        {{ student.first_name }}
                        {{ student.last_name }}

                    </option>

                    {% empty %}

                    <option disabled>

                        Select a class first

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Attended By</strong></td>

            <td>

                <select
                    name="attended_by"
                    required
                >

                    <option value="">-- Select Teacher/Nurse --</option>

                    {% for teacher in teachers %}

                    <option value="{{ teacher.id }}">

                        {{ teacher.first_name }}
                        {{ teacher.last_name }}

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Visit Date</strong></td>

            <td>

                <input
                    type="date"
                    name="visit_date"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Complaint</strong></td>

            <td>

                <input
                    type="text"
                    name="complaint"
                    style="width:400px;"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Diagnosis</strong></td>

            <td>

                <textarea
                    name="diagnosis"
                    rows="4"
                    cols="60"
                ></textarea>

            </td>

        </tr>

        <tr>

            <td><strong>Treatment</strong></td>

            <td>

                <textarea
                    name="treatment"
                    rows="4"
                    cols="60"
                ></textarea>

            </td>

        </tr>

        <tr>

            <td><strong>Temperature (°C)</strong></td>

            <td>

                <input
                    type="number"
                    step="0.1"
                    name="temperature"
                >

            </td>

        </tr>

        <tr>

            <td><strong>Status</strong></td>

            <td>

                <select
                    name="status"
                >

                    <option value="Under Treatment">
                        Under Treatment
                    </option>

                    <option value="Recovered">
                        Recovered
                    </option>

                    <option value="Referred">
                        Referred
                    </option>

                </select>

            </td>

        </tr>

        <tr>

            <td colspan="2">

                <button
                    type="submit"
                    name="save_visit"
                >

                    💾 Save Medical Visit

                </button>

                <a href="{% url 'medical_visit_list' %}">

                    <button type="button">

                        Cancel

                    </button>

                </a>

            </td>

        </tr>

    </table>

</form>

{% endblock %}

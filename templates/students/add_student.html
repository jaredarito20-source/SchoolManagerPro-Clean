{% extends "base.html" %}

{% block content %}

<h2>Add Student</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <table>

        <tr>
            <td>Admission Number</td>
            <td>
                <input
                    type="text"
                    name="admission_number"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>First Name</td>
            <td>
                <input
                    type="text"
                    name="first_name"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Last Name</td>
            <td>
                <input
                    type="text"
                    name="last_name"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>

                <select name="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </td>
        </tr>

        <tr>
            <td>Date of Birth</td>
            <td>
                <input
                    type="date"
                    name="date_of_birth"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Class</td>
            <td>

                <select
                    name="school_class"
                    required
                >

                    <option value="">
                        Select Class
                    </option>

                    {% for class in classes %}

                    <option value="{{ class.id }}">
                        {{ class.name }}
                    </option>

                    {% endfor %}

                </select>

            </td>
        </tr>

        <tr>
            <td>Parent Name</td>
            <td>
                <input
                    type="text"
                    name="parent_name"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Phone Number</td>
            <td>
                <input
                    type="text"
                    name="phone"
                    required
                >
            </td>
        </tr>

        <tr>
            <td>Student Photo</td>
            <td>
                <input
                    type="file"
                    name="photo"
                    accept="image/*"
                >
            </td>
        </tr>

        <tr>
            <td></td>
            <td>

                <button type="submit">
                    💾 Save Student
                </button>

                <a href="{% url 'student_list' %}">
                    Cancel
                </a>

            </td>
        </tr>

    </table>

</form>

{% endblock %}

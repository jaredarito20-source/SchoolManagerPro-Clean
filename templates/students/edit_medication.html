{% extends "base.html" %}

{% block content %}

<h2>✏ Edit Medication</h2>

<form method="post">

{% csrf_token %}

<p>

<label>Medication Name</label><br>

<input
    type="text"
    name="name"
    value="{{ medication.name }}"
    required
>

</p>

<p>

<label>Description</label><br>

<textarea
    name="description"
    rows="4"
>{{ medication.description }}</textarea>

</p>

<p>

<label>Quantity</label><br>

<input
    type="number"
    name="quantity"
    value="{{ medication.quantity }}"
    min="0"
    required
>

</p>

<p>

<label>Expiry Date</label><br>

<input
    type="date"
    name="expiry_date"
    value="{{ medication.expiry_date|date:'Y-m-d' }}"
>

</p>

<button type="submit">

    💾 Update Medication

</button>

<a href="{% url 'medication_list' %}">

    <button type="button">

        Cancel

    </button>

</a>

</form>

{% endblock %}

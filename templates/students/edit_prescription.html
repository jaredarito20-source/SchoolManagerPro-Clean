{% extends "base.html" %}

{% block content %}

<h2>✏ Edit Prescription</h2>

<form method="post">

    {% csrf_token %}

    <table cellpadding="8">

        <tr>

            <td><strong>Class</strong></td>

            <td>

                <select
                    name="school_class"
                    onchange="this.form.submit()"
                    required
                >

                    {% for class in classes %}

                    <option
                        value="{{ class.id }}"
                        {% if selected_class == class.id|stringformat:"s" %}
                        selected
                        {% endif %}
                    >

                        {{ class.name }}

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Medical Visit</strong></td>

            <td>

                <select
                    name="medical_visit"
                    required
                >

                    {% for visit in visits %}

                    <option
                        value="{{ visit.id }}"
                        {% if visit.id == prescription.medical_visit.id %}
                        selected
                        {% endif %}
                    >

                        {{ visit.student.admission_number }}
                        -
                        {{ visit.student.first_name }}
                        {{ visit.student.last_name }}
                        -
                        {{ visit.visit_date }}

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Medication</strong></td>

            <td>

                <select
                    name="medication"
                    required
                >

                    {% for medication in medications %}

                    <option
                        value="{{ medication.id }}"
                        {% if medication.id == prescription.medication.id %}
                        selected
                        {% endif %}
                    >

                        {{ medication.name }}
                        (Stock: {{ medication.quantity_in_stock }})

                    </option>

                    {% endfor %}

                </select>

            </td>

        </tr>

        <tr>

            <td><strong>Dosage</strong></td>

            <td>

                <input
                    type="text"
                    name="dosage"
                    value="{{ prescription.dosage }}"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Frequency</strong></td>

            <td>

                <input
                    type="text"
                    name="frequency"
                    value="{{ prescription.frequency }}"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Duration</strong></td>

            <td>

                <input
                    type="text"
                    name="duration"
                    value="{{ prescription.duration }}"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Quantity</strong></td>

            <td>

                <input
                    type="number"
                    name="quantity"
                    value="{{ prescription.quantity }}"
                    min="1"
                    required
                >

            </td>

        </tr>

        <tr>

            <td><strong>Instructions</strong></td>

            <td>

                <textarea
                    name="instructions"
                    rows="4"
                    cols="60"
                >{{ prescription.instructions }}</textarea>

            </td>

        </tr>

        <tr>

            <td colspan="2">

                <button type="submit">

                    💾 Update Prescription

                </button>

                <a href="{% url 'students:prescription_list' %}">

                    <button type="button">

                        Cancel

                    </button>

                </a>

            </td>

        </tr>

    </table>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<h1>Dashboard</h1>

<style>
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:20px;
    margin-top:20px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    text-align:center;
}

.stat-card h2{
    color:#1565c0;
    font-size:40px;
}

.stat-card p{
    margin-top:10px;
    color:#555;
    font-size:18px;
}
</style>

<div class="dashboard">

    <div class="stat-card">
        <h2>{{ total_students }}</h2>
        <p>Students</p>
    </div>

    <div class="stat-card">
        <h2>{{ total_teachers }}</h2>
        <p>Teachers</p>
    </div>

    <div class="stat-card">
        <h2>{{ total_classes }}</h2>
        <p>Classes</p>
    </div>

    <div class="stat-card">
        <h2>{{ total_subjects }}</h2>
        <p>Subjects</p>
    </div>

</div>

{% endblock %}

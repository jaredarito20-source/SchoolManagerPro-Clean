{% extends "base.html" %}

{% block content %}

<h2>Marks</h2>

<p>
    <a href="{% url 'add_mark' %}">
        <button>Add Marks</button>
    </a>
</p>

<table border="1" width="100%" cellpadding="8">
    <tr>
        <th>Student</th>
        <th>Subject</th>
        <th>Exam</th>
        <th>Marks</th>
        <th>Actions</th>
        <th>Grade</th>
    </tr>

    {% for mark in marks %}
    <tr>
        <td>{{ mark.student }}</td>
        <td>{{ mark.subject }}</td>
        <td>{{ mark.exam }}</td>
        <td>{{ mark.marks }}</td>
        <td>{{ mark.grade }}</td>
        <td>
            <a href="{% url 'edit_mark' mark.id %}">✏ Edit</a> |
            <a href="{% url 'delete_mark' mark.id %}">🗑 Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No marks entered.</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}

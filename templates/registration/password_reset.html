{% extends "base.html" %}

{% block content %}

<h2>Forgot Password?</h2>

<p>
    Enter the email address associated with your account.
    If an account exists, we will send you a password reset link.
</p>

<form method="post">

    {% csrf_token %}

    {{ form.email.errors }}

    <p>
        <label for="id_email">Email Address</label><br>

        <input
            type="email"
            name="email"
            id="id_email"
            placeholder="Enter your email"
            required
        >
    </p>

    <button type="submit">
        Send Reset Link
    </button>

</form>

<p>
    <a href="{% url 'login' %}">
        Back to Login
    </a>
</p>

{% endblock %}

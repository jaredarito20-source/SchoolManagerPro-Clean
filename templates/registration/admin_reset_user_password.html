{% extends "base.html" %}

{% block content %}

<h2>🔐 Reset User Password</h2>

<p>
    You are resetting the password for:
</p>

<p>
    <strong>
        {{ target_user.get_full_name|default:target_user.username }}
    </strong>
</p>

<form method="post">

    {% csrf_token %}

    <p>
        <label>
            New Password
        </label><br>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >
    </p>

    <p>
        <label>
            Confirm New Password
        </label><br>

        <input
            type="password"
            name="password_confirm"
            minlength="8"
            required
        >
    </p>

    <button type="submit">
        🔐 Reset Password
    </button>

    <a href="{% url 'user_list' %}">
        <button type="button">
            Cancel
        </button>
    </a>

</form>

{% endblock %}
